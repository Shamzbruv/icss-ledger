<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a2d"><meta name="robots" content="index,follow">
  <title>Connect with iCreate Solutions &amp; Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/link-hub.css"><link rel="icon" href="/assets/icss-logo.png">
</head>
<body>
  <div class="ambient one"></div><div class="ambient two"></div>
  <main class="hub-shell">
    <header class="profile">
      <div class="logo-wrap"><img id="hubLogo" src="/assets/icss-logo.png" alt="Business logo"></div>
      <p class="hello">LET'S CONNECT</p><h1 id="hubName">iCreate Solutions &amp; Services</h1>
      <p id="hubTagline" class="tagline">Smart digital solutions for growing businesses.</p>
    </header>
    <section id="hubLinks" class="link-list" aria-label="Helpful links"><div class="loading">Loading your links…</div></section>
    <footer>Make your next idea happen <span>✦</span></footer>
  </main>
  <div id="offerModal" class="offer-backdrop" hidden>
    <section class="offer-card" role="dialog" aria-modal="true" aria-labelledby="offerTitle">
      <button id="closeOffer" class="offer-close" aria-label="Close offer">×</button>
      <div class="gift">✦</div><p id="offerEyebrow" class="offer-eyebrow"></p><h2 id="offerTitle"></h2>
      <p id="offerDescription" class="offer-description"></p>
      <div id="offerCodeWrap" class="code-wrap">Use code <strong id="offerCode"></strong><button id="copyCode" type="button">Copy</button></div>
      <a id="offerButton" class="offer-button" target="_blank" rel="noopener"></a>
    </section>
  </div>
  <script src="/js/link-hub.js"></script>
</body></html>
