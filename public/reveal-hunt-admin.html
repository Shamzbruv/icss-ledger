<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reveal Hunt Entries | ICSS Command Center</title>
    <link rel="stylesheet" href="css/style.css?v=20261101-app">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/icss-logo.png">
    <style>
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary-color); }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
        .pill-pink { background: rgba(255, 77, 141, .18); color: #ff6ea1; }
        .pill-blue { background: rgba(74, 125, 255, .18); color: #7da0ff; }
        .pill-done { background: rgba(46, 213, 115, .18); color: #2ed573; }
        .pill-open { background: rgba(116, 125, 140, .2); color: #a4acb8; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    </style>

    <meta name="theme-color" content="#0b2447">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ICSS">
    <link rel="manifest" href="/command-center.webmanifest">
    <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/pwa.css?v=20261101">
    <script defer src="/js/pwa.js?v=20261101"></script>
</head>
<body>

    <!-- Layout.js injects Header here -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js?v=restore-20261029"></script>
    <script type="module" src="js/layout.js?v=20261101-app"></script>

    <div class="container fade-in">
        <h1 class="mb-4">Reveal Hunt Entries</h1>
        <p class="text-muted" style="margin-top: -10px;">Guests who played the game at <a href="/reveal-hunt/" target="_blank" rel="noopener" style="color: var(--primary-color);">/reveal-hunt/</a>. Entries stay here until you delete them.</p>

        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Guests</div></div>
            <div class="stat-card"><div class="stat-value" id="statDone" style="color: #2ed573;">0</div><div class="stat-label">Finished</div></div>
            <div class="stat-card"><div class="stat-value" id="statPink" style="color: #ff6ea1;">0</div><div class="stat-label">Team Pink</div></div>
            <div class="stat-card"><div class="stat-value" id="statBlue" style="color: #7da0ff;">0</div><div class="stat-label">Team Blue</div></div>
        </div>

        <div class="card">
            <div class="toolbar">
                <button class="btn btn-sm btn-outline-light" id="refreshBtn" type="button">⟳ Refresh</button>
                <button class="btn btn-sm btn-outline-light" id="deleteAllBtn" type="button" style="margin-left: auto; color: #ff4757; border-color: #ff4757;">Delete all entries</button>
            </div>
            <p id="status" class="text-muted" role="status"></p>
            <div class="table-responsive">
                <table class="table-mobile-cards">
                    <thead>
                        <tr>
                            <th>Played</th>
                            <th>Guest</th>
                            <th>Team</th>
                            <th>Tickets</th>
                            <th>Who's more likely</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="entriesBody">
                        <tr><td colspan="7" class="text-center">Loading entries...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const QUESTIONS = {
            q1: 'The 3 a.m. feeding',
            q2: 'Cries first at the reveal',
            q3: 'Packs way too much',
            q4: 'Falls asleep first'
        };
        let entries = [];

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function setStatus(text) { document.getElementById('status').textContent = text || ''; }

        async function loadEntries() {
            setStatus('');
            try {
                const res = await apiFetch('/api/reveal-hunt/admin/entries');
                if (res.status === 503) {
                    const body = await res.json().catch(() => ({}));
                    setStatus(body.error || 'The guest book table is not set up yet.');
                    entries = [];
                } else if (res.ok) {
                    entries = await res.json();
                } else {
                    throw new Error('HTTP ' + res.status);
                }
                render();
            } catch (e) {
                console.error('Failed to load entries', e);
                document.getElementById('entriesBody').innerHTML = '<tr><td colspan="7" class="text-center">Failed to load entries</td></tr>';
            }
        }

        function render() {
            document.getElementById('statTotal').textContent = entries.length;
            document.getElementById('statDone').textContent = entries.filter(e => e.finished).length;
            document.getElementById('statPink').textContent = entries.filter(e => e.team === 'pink').length;
            document.getElementById('statBlue').textContent = entries.filter(e => e.team === 'blue').length;

            const tbody = document.getElementById('entriesBody');
            tbody.innerHTML = '';
            if (!entries.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No entries yet.</td></tr>';
                return;
            }
            entries.forEach(entry => {
                const tr = document.createElement('tr');
                const picks = entry.picks || {};
                const pickText = Object.keys(QUESTIONS).filter(k => picks[k])
                    .map(k => `${escapeHTML(QUESTIONS[k])}: <strong>${picks[k] === 'halona' ? 'Halona' : 'Shamar'}</strong>`).join('<br>') || '—';
                const team = entry.team ? `<span class="pill pill-${entry.team}">Team ${entry.team === 'pink' ? 'Pink' : 'Blue'}</span>` : '—';
                const status = entry.finished ? '<span class="pill pill-done">Saw the reveal</span>' : '<span class="pill pill-open">Playing</span>';

                const cells = [
                    new Date(entry.created_at).toLocaleString(),
                    `<strong>${escapeHTML(entry.guest_name) || '<em>No name</em>'}</strong>`,
                    team,
                    `${entry.tickets_won || 0} of 5`,
                    `<small>${pickText}</small>`,
                    status
                ];
                cells.forEach(html => { const td = document.createElement('td'); td.innerHTML = html; tr.appendChild(td); });

                const tdAction = document.createElement('td');
                const btn = document.createElement('button');
                btn.className = 'btn btn-sm btn-outline-light';
                btn.style.color = '#ff4757';
                btn.style.borderColor = '#ff4757';
                btn.textContent = 'Delete';
                btn.addEventListener('click', () => deleteEntry(entry));
                tdAction.appendChild(btn);
                tr.appendChild(tdAction);
                tbody.appendChild(tr);
            });
        }

        async function deleteEntry(entry) {
            const who = entry.guest_name || 'this guest';
            if (!confirm(`Delete the entry for ${who}? This cannot be undone.`)) return;
            const res = await apiFetch('/api/reveal-hunt/admin/entries/' + encodeURIComponent(entry.id), { method: 'DELETE' });
            if (!res.ok) { setStatus('Could not delete that entry.'); return; }
            await loadEntries();
        }

        async function deleteAll() {
            if (!entries.length) return;
            if (!confirm(`Delete all ${entries.length} entries? This cannot be undone.`)) return;
            const res = await apiFetch('/api/reveal-hunt/admin/entries?confirm=all', { method: 'DELETE' });
            if (!res.ok) { setStatus('Could not delete the entries.'); return; }
            await loadEntries();
        }

        document.getElementById('refreshBtn').addEventListener('click', loadEntries);
        document.getElementById('deleteAllBtn').addEventListener('click', deleteAll);
        loadEntries();
    </script>
</body>
</html>
